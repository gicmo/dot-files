# tmux configuration

# Prefix
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Windows and panes start at 1, as on the keyboard
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# Terminal
set -g default-terminal "tmux-256color"
set -s escape-time 10

# Behaviour
set -g history-limit 50000
set -g display-time 4000
set -g status-interval 5
set -g focus-events on
set -g status-keys emacs
setw -g aggressive-resize on

# Theme: Doom One, matching the ghostty `doom1ck` palette
# bg #282c34  bg-alt #3f444a  fg #bbc2cf  grey #5b6268
# red #ff6c6b  green #98be65  yellow #ecbe7b  blue #51afef

# Status Line
set -g status-style "bg=#282c34,fg=#bbc2cf"
set -g status-position bottom
set -g status-justify left

set -g status-left ''
set -g status-left-length 10
set -g status-right-length 50
set -g status-left " #[bold]#S#[nobold] "
set -g status-right "#[fg=#51afef]#h "

set -g window-status-separator ""
set -g window-status-format " #I #W "
set -g window-status-current-format "#[bg=#51afef,fg=#282c34,bold] #I #W "
set -g window-status-activity-style "fg=#ecbe7b"
set -g window-status-bell-style "fg=#ff6c6b,bold"

set -g pane-border-style "fg=#3f444a"
set -g pane-active-border-style "fg=#51afef"
set -g pane-border-indicators off

set -g message-style "bg=#ecbe7b,fg=#282c34,bold"
set -g message-command-style "bg=#3f444a,fg=#bbc2cf"

set -g mode-style "bg=#51afef,fg=#282c34"
setw -g clock-mode-colour "#51afef"

# Bindings
bind C-n next-window
bind C-p previous-window
bind R source-file ~/.tmux.conf \; display-message "sourced ~/.tmux.conf"
