# tmux configuration

# Prefix
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Windows and panes start at 1, as on the keyboard
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# Terminal
set -g default-terminal "tmux-256color"
set -s escape-time 10
set -g set-titles on

# Behaviour
set -g mouse on
set -g history-limit 50000
set -g display-time 4000
set -g status-interval 5
set -g focus-events on
set -g status-keys emacs
setw -g aggressive-resize on

# Theme: Doom One, matching the ghostty `doom1ck` palette
# bg #282c34  bg-alt #3f444a  fg #bbc2cf  grey #5b6268
# red #ff6c6b  green #98be65  yellow #ecbe7b  blue #51afef

# Status Line: dotbar-style, minimal
set -g status-position top
set -g status-justify absolute-centre
set -g status-style "bg=#282c34,fg=#5b6268"

# Left: session name; rounded pill highlight while the prefix is active
set -g status-left-length 30
set -g status-left "#{?client_prefix,#[fg=#51afef]▐#[bg=#51afef]#[fg=#282c34]#[bold] #S #[nobold]#[bg=#282c34]#[fg=#51afef]▌,#[fg=#5b6268]  #S  }#[default] "
set -g status-right ""

# Windows: minimal, dot-separated, no numbers
set -g window-status-separator " • "
set -g window-status-style "bg=#282c34,fg=#5b6268"
set -g window-status-format " #W "
set -g window-status-current-format " #[fg=#bbc2cf]#W#[default]#{?window_zoomed_flag,#[fg=#51afef] ⛶#[default],} "
set -g window-status-activity-style "fg=#ecbe7b"
set -g window-status-bell-style "fg=#ff6c6b,bold"

set -g pane-border-style "fg=#3f444a"
set -g pane-active-border-style "fg=#51afef"
set -g pane-border-indicators off

set -g message-style "bg=#ecbe7b,fg=#282c34,bold"
set -g message-command-style "bg=#3f444a,fg=#bbc2cf"

set -g mode-style "bg=#51afef,fg=#282c34"
setw -g clock-mode-colour "#51afef"

# Bindings
bind C-n next-window
bind C-p previous-window
bind R source-file ~/.tmux.conf \; display-message "sourced ~/.tmux.conf"
